# Install root-owned as /etc/ssh/sshd_config.d/60-leadbridge-deploy.conf.
# Validate with sshd -t before reload. Applies only to the CI deployment identity.
Match User leadbridge-deploy
    ForceCommand /usr/bin/sudo -n /usr/local/sbin/lead-bridge-deploy
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
Match all
